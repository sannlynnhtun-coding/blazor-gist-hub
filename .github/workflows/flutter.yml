name: Build and release GistHub Flutter

on:
  push:
    branches: [main, master]
    tags: ['flutter-v*']
    paths: ['GistHub.Flutter/**', '.github/workflows/flutter.yml']
  pull_request:
    branches: [main, master]
    paths: ['GistHub.Flutter/**', '.github/workflows/flutter.yml']
  workflow_dispatch:
    inputs:
      deploy_web:
        description: Deploy Flutter Web to its separate Vercel project
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GistHub.Flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - run: flutter build web --release --no-pub --no-web-resources-cdn
      - run: cp vercel.json build/web/vercel.json
      - run: flutter build apk --release --no-pub
      - run: flutter build appbundle --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: GistHub.Flutter/build/web/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: GistHub.Flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-aab
          path: GistHub.Flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: GistHub.Flutter/coverage/lcov.info
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_web
        with:
          node-version: 24
      - name: Deploy Flutter Web
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_web && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        working-directory: GistHub.Flutter/build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.FLUTTER_VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@52.0.0 deploy --prod --yes

  release:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-apk
          path: release
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `GistHub Flutter ${tag}`,
              body: 'Flutter Web + Android build verified in GitHub Actions. YouTube Downloader is excluded. This APK uses development signing and is intended for testing, not Google Play publishing.'
            });
            const data = fs.readFileSync('release/app-release.apk');
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.data.id,
              name: 'GistHub-Flutter.apk', data,
              headers: { 'content-type': 'application/vnd.android.package-archive', 'content-length': data.length }
            });
