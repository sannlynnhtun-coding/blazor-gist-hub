<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GistHub — Bold Snippet Manager</title>
    <base href="/" />
    <meta name="theme-color" content="#FFD524" />
    <link rel="stylesheet" href="css/output.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="css/atom-one-dark.min.css">
    <script>
        // Init Theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
        window.isDarkThemeActive = () => document.documentElement.classList.contains('dark');
    </script>
</head>

<body class="bg-background text-foreground transition-colors duration-300">
    <div id="app">
        <div class="fixed inset-0 flex flex-col items-center justify-center bg-background overflow-hidden">
            <div class="relative flex flex-col items-center gap-8 animate-in fade-in zoom-in duration-1000">
                <!-- Logo -->
                <div class="relative">
                    <div class="relative w-24 h-24 overflow-hidden rounded-md border-2 border-black shadow-2xl animate-bounce">
                        <img src="logo.svg" class="w-full h-full object-cover" />
                    </div>
                </div>

                <!-- Text Branding -->
                <div class="flex flex-col items-center gap-2">
                    <h1 class="text-3xl font-black tracking-tighter">GistHub</h1>
                    <div class="flex items-center gap-3">
                        <div class="flex gap-1">
                            <div class="w-1.5 h-1.5 rounded-full bg-primary animate-bounce"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-primary animate-bounce [animation-delay:-0.3s]"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-primary animate-bounce [animation-delay:-0.5s]"></div>
                        </div>
                        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-muted-foreground/60">Loading Workspace</span>
                    </div>
                </div>
            </div>

            <!-- Custom Animation Styles -->
            <style>
                @keyframes shimmer {
                    100% { transform: translateX(100%); }
                }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-0 left-0 w-full bg-destructive text-destructive-foreground p-4 z-[9999] shadow-lg flex items-center justify-between">
        <span class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-alert-circle"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            An unhandled error has occurred.
        </span>
        <div class="flex items-center gap-4">
            <a href="." class="reload px-3 py-1 bg-white/10 hover:bg-white/20 rounded-md text-sm transition-all underline decoration-dotted">Reload</a>
            <span class="dismiss cursor-pointer p-1 hover:bg-white/10 rounded-full">🗙</span>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script>
        // Mermaid config
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        }

        window.highlightCode = (element) => {
            if (element && typeof hljs !== 'undefined') {
                hljs.highlightElement(element);
            } else if (element) {
                // Retry after a small delay if hljs isn't ready
                setTimeout(() => {
                    if (typeof hljs !== 'undefined') {
                        hljs.highlightElement(element);
                    }
                }, 100);
            }
        };

        window.renderMarkdown = async (element, markdownText) => {
            if (!element) return;
            
            if (typeof marked === 'undefined') {
                element.innerText = markdownText;
                return;
            }

            element.innerHTML = marked.parse(markdownText);

            // Convert fenced Mermaid blocks rendered by marked into Mermaid containers.
            element.querySelectorAll('pre code').forEach((block) => {
                const className = block.className || "";
                const isMermaid = /\blanguage-mermaid\b|\blang-mermaid\b/.test(className);
                if (!isMermaid) return;

                const pre = block.parentElement;
                if (!pre || pre.tagName.toLowerCase() !== 'pre') return;

                const mermaidContainer = document.createElement('div');
                mermaidContainer.className = 'mermaid';
                mermaidContainer.textContent = block.textContent || '';
                pre.replaceWith(mermaidContainer);
            });

            // Initialize mermaid
            if (typeof mermaid !== 'undefined') {
                try {
                    await mermaid.run({
                        nodes: element.querySelectorAll('.mermaid'),
                    });
                } catch (e) {
                    console.error("Mermaid rendering failed", e);
                }
            }
            
            // Highlight code blocks
            element.querySelectorAll('pre code').forEach((block) => {
                window.highlightCode(block);
            });
        };

        window.copyToClipboard = async (text) => {
            if (navigator.clipboard) {
                await navigator.clipboard.writeText(text);
            }
        };
    </script>
    <script src="js/indexedDb.js" type="module"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
